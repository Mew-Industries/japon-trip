    align-items: center;
    margin-bottom: 10px;
  }
  .card-num {
    width: 28px; height: 28px; border-radius: 50%;
    background: #5DCAA5; border: 2px solid #0F6E56;

  }

    className: '', iconSize: [30, 30], iconAnchor: [15, 15],
  });
  const marker = L.marker(d.coords, { icon }).addTo(map);
  const popupHtml =
    '<div class="popup-title">' + d.n + '. ' + d.short + '</div>' +
    '<div class="popup-dates">' + d.dates + ' · ' + d.nights + ' noches</div>' +
    '<div class="popup-why">' + d.intro + '</div>';
  marker.bindPopup(popupHtml);
  markers[d.id] = marker;
});

      '<div class="popup-why">' + dt.desc + '</div>'
    );
    dtMarkers[dt.id] = marker;
  });
});

const allCoords = routeCoords.concat(
  destinations.flatMap(d => d.daytrips.map(dt => dt.coords))
);
map.fitBounds(L.latLngBounds(allCoords), { padding: [40, 40] });

// =========================================================================
// CARDS
// =========================================================================

const detailsList = document.getElementById('details-list');
const cards = {};

destinations.forEach(d => {
  const card = document.createElement('article');
  card.className = 'dest-card';
  card.dataset.id = d.id;

  const dtHtml = d.daytrips.length > 0
    ? '<div class="card-section-title">Day trips</div>' +
      d.daytrips.map(dt =>
        '<div class="dt-row" data-dt-id="' + dt.id + '">' +
          '<div class="dt-row-header">' +
            '<span class="dt-row-name">' + dt.name + '</span>' +
            '<span class="dt-row-time">' + dt.time + '</span>' +
          '</div>' +
          '<div class="dt-row-desc">' + dt.desc + '</div>' +
        '</div>'
      ).join('')
    : '';

  card.innerHTML =
    '<div class="card-header">' +
      '<div class="card-num">' + d.n + '</div>' +
      '<div class="card-title-wrap">' +
        '<h2>' + d.name + '</h2>' +
        '<div class="card-meta">' + d.dates + ' · ' + d.nights + ' noches</div>' +
      '</div>' +
      '<div class="card-temps">' +
        '<div class="temp-pill temp-max"><span class="temp-label">Máx</span><span class="temp-value">' + d.tempMax + '°</span></div>' +
        '<div class="temp-pill temp-min"><span class="temp-label">Mín</span><span class="temp-value">' + d.tempMin + '°</span></div>' +
      '</div>' +
    '</div>' +
    '<p class="card-intro">' + d.intro + '</p>' +
    '<div class="card-section-title">Qué hacer</div>' +
    '<ul class="card-list">' + d.activities.map(a => '<li>' + a + '</li>').join('') + '</ul>' +
    dtHtml;
  detailsList.appendChild(card);
  cards[d.id] = card;

  // Card hover/click → mapa
  card.addEventListener('mouseenter', () => {
    card.classList.add('active');
    highlightMarker(d.id);
  });
  card.addEventListener('mouseleave', () => {
    card.classList.remove('active');
    unhighlightMarker(d.id);
  });
  card.addEventListener('click', (e) => {
    // Don't trigger card click on day trip clicks
    if (e.target.closest('.dt-row')) return;
    markers[d.id].openPopup();
    map.flyTo(d.coords, 8, { duration: 0.8 });
  });

  // Day trip clicks
  card.querySelectorAll('.dt-row').forEach(row => {
    const dtId = row.dataset.dtId;
    row.addEventListener('mouseenter', (e) => {
      e.stopPropagation();
      highlightDaytrip(dtId);
    });
    row.addEventListener('mouseleave', (e) => {
      e.stopPropagation();
      unhighlightDaytrip(dtId);
    });
    row.addEventListener('click', (e) => {
      e.stopPropagation();
      dtMarkers[dtId].openPopup();
      const dt = d.daytrips.find(x => x.id === dtId);
      map.flyTo(dt.coords, 9, { duration: 0.8 });
    });
  });
});

function highlightMarker(id) {
  const el = document.querySelector('.marker-num[data-id="' + id + '"]');
  if (el) el.classList.add('active');
}
function unhighlightMarker(id) {
  const el = document.querySelector('.marker-num[data-id="' + id + '"]');
  if (el) el.classList.remove('active');
}
function highlightDaytrip(id) {
  const el = document.querySelector('.marker-dot[data-id="' + id + '"]');
  if (el) el.classList.add('active');
}
function unhighlightDaytrip(id) {
  const el = document.querySelector('.marker-dot[data-id="' + id + '"]');
  if (el) el.classList.remove('active');
}

// Bidirectional: map markers → cards
Object.entries(markers).forEach(([id, marker]) => {
  marker.on('mouseover', () => {
    highlightMarker(id);
    if (cards[id]) cards[id].classList.add('active');
  });
  marker.on('mouseout', () => {
    unhighlightMarker(id);
    if (cards[id]) cards[id].classList.remove('active');
  });
  marker.on('click', () => {
    // Scroll card into view
    if (cards[id]) {
      cards[id].scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  });
});

Object.entries(dtMarkers).forEach(([id, marker]) => {
  marker.on('mouseover', () => highlightDaytrip(id));
  marker.on('mouseout', () => unhighlightDaytrip(id));
});

// =========================================================================
// CHART
// =========================================================================

const ctx = document.getElementById('weatherChart').getContext('2d');

const avg = (range) => {
  const [lo, hi] = range.split('-').map(Number);
  return Math.round((lo + hi) / 2);
};

new Chart(ctx, {
  type: 'line',
  data: {
    labels: destinations.map(d => d.short),
    datasets: [
      {
        label: 'Máx',
        data: destinations.map(d => avg(d.tempMax)),
        borderColor: '#D85A30',
        backgroundColor: 'rgba(216, 90, 48, 0.10)',
        tension: 0.35,
        pointRadius: 3,
        pointHoverRadius: 5,
        pointBackgroundColor: '#D85A30',
        borderWidth: 2,
        fill: '+1'
      },
      {
        label: 'Mín',
        data: destinations.map(d => avg(d.tempMin)),
        borderColor: '#1D9E75',
        backgroundColor: 'rgba(29, 158, 117, 0.10)',
        tension: 0.35,
        pointRadius: 3,
        pointHoverRadius: 5,
        pointBackgroundColor: '#1D9E75',
        borderWidth: 2,
        fill: false
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: {
        position: 'top',
        align: 'end',
        labels: {
          font: { size: 11, weight: 500 },
          padding: 8,
          boxWidth: 10,
          boxHeight: 10,
          usePointStyle: true,
          pointStyle: 'circle'
        }
      },
      tooltip: {
        backgroundColor: 'rgba(20, 20, 20, 0.92)',
        titleFont: { size: 12, weight: 600 },
        bodyFont: { size: 12 },
        padding: 8,
        cornerRadius: 6,
        callbacks: {
          title: (items) => {
            const d = destinations[items[0].dataIndex];
            return d.short + ' · ' + d.dates;
          },
          label: (item) => {
            const d = destinations[item.dataIndex];
            const range = item.dataset.label === 'Máx' ? d.tempMax : d.tempMin;
            return item.dataset.label + ': ' + range + '°C';
          }
        }
      }
    },
    onClick: (event, elements) => {
      if (elements.length > 0) {
        const idx = elements[0].index;
        const d = destinations[idx];
        if (cards[d.id]) {
          cards[d.id].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        map.flyTo(d.coords, 7, { duration: 0.8 });
      }
    },
    onHover: (event, elements) => {
      event.native.target.style.cursor = elements.length > 0 ? 'pointer' : 'default';
    },
    scales: {
      y: {
        beginAtZero: false,
        suggestedMin: 5,
        suggestedMax: 30,
        ticks: {
          callback: (v) => v + '°',
          font: { size: 10 },
          color: 'rgba(0,0,0,0.5)',
          padding: 4
        },
        grid: { color: 'rgba(0,0,0,0.05)', drawBorder: false }
      },
      x: {
        ticks: {
          font: { size: 9 },
          color: 'rgba(0,0,0,0.55)',
          maxRotation: 35,
          minRotation: 35,
          autoSkip: false
        },
        grid: { display: false, drawBorder: false }
      }
    },
    interaction: { intersect: false, mode: 'index' }
  }
});
</script>
</body>
</html>
